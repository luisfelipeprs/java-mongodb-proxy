micronaut:
  application:
    name: mongo-proxy
  server:
    port: 8080

mongodb:
  uri: ${MONGODB_URI:`mongodb://localhost:27017`}
  database: ${MONGODB_DATABASE:mydb}
  users-collection: ${MONGODB_USERS_COLLECTION:users}
  pool:
    max-size: ${MONGODB_POOL_MAX_SIZE:50}
    min-size: ${MONGODB_POOL_MIN_SIZE:2}
    max-wait-time-ms: ${MONGODB_POOL_MAX_WAIT_MS:5000}
    max-connection-idle-time-ms: ${MONGODB_POOL_MAX_IDLE_MS:60000}

mongo-proxy:
  # Se definido (via env var PROXY_API_KEY), exige o header X-API-Key em todas
  # as chamadas exceto /health. Deixe em branco para desativar (padrão).
  api-key: ${PROXY_API_KEY:}
