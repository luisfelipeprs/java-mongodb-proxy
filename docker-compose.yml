services:
  mongo-proxy:
    build: .
    image: mongo-proxy:latest
    container_name: mongo-proxy
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://host.docker.internal:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-mydb}
      MONGODB_USERS_COLLECTION: ${MONGODB_USERS_COLLECTION:-users}
      MONGODB_POOL_MAX_SIZE: ${MONGODB_POOL_MAX_SIZE:-50}
      MONGODB_POOL_MIN_SIZE: ${MONGODB_POOL_MIN_SIZE:-5}
      PROXY_API_KEY: ${PROXY_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
